name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    # if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Decide bump
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          msg=$(git log -1 --pretty=%s)
          echo "commit_msg=$msg" >> "$GITHUB_OUTPUT"
          if [[ "$msg" =~ ^feat(\(.+\))?: ]]; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          elif [[ "$msg" =~ ^fix(\(.+\))?: ]]; then
            echo "level=patch" >> "$GITHUB_OUTPUT"
          else
            echo "level=" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        if: steps.bump.outputs.level != ''
        shell: bash
        run: |
          set -euo pipefail
          uv version --bump "${{ steps.bump.outputs.level }}"

      - name: Check changes
        if: steps.bump.outputs.level != ''
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and tag
        if: steps.bump.outputs.level != '' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml','rb') as f:
            print(tomllib.load(f)['project']['version'])
          PY
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore(release): v${version}"
          git tag "v${version}"
          git push --follow-tags

      - name: Build
        if: steps.bump.outputs.level != '' && steps.changes.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        if: steps.bump.outputs.level != '' && steps.changes.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.UV_PUBLISH_TOKEN }}

      - name: Trigger Read the Docs
        if: steps.bump.outputs.level != '' && steps.changes.outputs.changed == 'true' && secrets.RTD_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST "${{ secrets.RTD_WEBHOOK_URL }}"
