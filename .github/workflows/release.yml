name: Release

on:
  workflow_run:
    workflows: ["Python package"]
    types:
      - completed

permissions:
  contents: write
  id-token: write

jobs:
  analyze:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&  github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.bump.outputs.level }}
      should_release: ${{ steps.bump.outputs.level != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Ensure branch checkout
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "${{ github.event.workflow_run.head_branch }}" "${{ github.event.workflow_run.head_sha }}"

      - name: Decide bump
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          msg=$(git log -1 --pretty=%s)
          echo "commit_msg=$msg" >> "$GITHUB_OUTPUT"
          if [[ "$msg" =~ ^feat(\(.+\))?: ]]; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          elif [[ "$msg" =~ ^fix(\(.+\))?: ]]; then
            echo "level=patch" >> "$GITHUB_OUTPUT"
          else
            echo "level=" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip release notice
        if: steps.bump.outputs.level == ''
        run: echo "No feat/fix in last commit. Skipping release."

  release:
    needs: analyze
    if: needs.analyze.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: pyznuny

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Ensure branch checkout
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "${{ github.event.workflow_run.head_branch }}" "${{ github.event.workflow_run.head_sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Bump version
        shell: bash
        run: |
          set -euo pipefail
          uv version --bump "${{ needs.analyze.outputs.level }}"

      - name: Check changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and tag
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml','rb') as f:
            print(tomllib.load(f)['project']['version'])
          PY
          )
          minor_tag=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml','rb') as f:
            v = tomllib.load(f)['project']['version']
          parts = v.split(".")
          print(f"v{parts[0]}.{parts[1]}")
          PY
          )
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore(release): v${version}"
          git tag "v${version}"
          git tag -f "${minor_tag}"
          git push --follow-tags
          git push -f origin "${minor_tag}"

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        if: steps.changes.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.UV_PUBLISH_TOKEN }}
