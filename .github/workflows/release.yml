name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: pyznuny

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Decide bump
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          pr_info=$(python -c 'import json, os, urllib.request; repo=os.environ.get("GITHUB_REPOSITORY"); sha=os.environ.get("GITHUB_SHA"); token=os.environ.get("GITHUB_TOKEN");\n\
if not repo or not sha or not token: raise SystemExit;\n\
url=f"https://api.github.com/repos/{repo}/commits/{sha}/pulls";\n\
req=urllib.request.Request(url, headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}"});\n\
try:\n\
  data=json.load(urllib.request.urlopen(req));\n\
  if isinstance(data, list) and data:\n\
    title=data[0].get("title") or ""; body=data[0].get("body") or "";\n\
    print(json.dumps({"title": title, "body": body}))\n\
except Exception:\n\
  pass')
          msg=$(git log -1 --pretty=%s)
          body=""
          if [[ -n "$pr_info" ]]; then
            msg=$(python -c 'import json,sys; data=json.loads(sys.argv[1]); print(data.get("title",""))' "$pr_info")
            body=$(python -c 'import json,sys; data=json.loads(sys.argv[1]); print(data.get("body",""))' "$pr_info")
          fi
          echo "commit_msg=$msg" >> "$GITHUB_OUTPUT"
          if [[ "$body" == *"BREAKING CHANGE"* ]]; then
            echo "level=major" >> "$GITHUB_OUTPUT"
          elif [[ "$msg" =~ ^feat(\(.+\))?!: ]]; then
            echo "level=major" >> "$GITHUB_OUTPUT"
          elif [[ "$msg" =~ ^feat(\(.+\))?: ]]; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          elif [[ "$msg" =~ ^fix(\(.+\))?: ]]; then
            echo "level=patch" >> "$GITHUB_OUTPUT"
          else
            echo "level=" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        if: steps.bump.outputs.level != ''
        shell: bash
        run: |
          set -euo pipefail
          uv version --bump "${{ steps.bump.outputs.level }}"

      - name: Check changes
        if: steps.bump.outputs.level != ''
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and tag
        if: steps.bump.outputs.level != '' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml','rb') as f:
            print(tomllib.load(f)['project']['version'])
          PY
          )
          minor_tag=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml','rb') as f:
            v = tomllib.load(f)['project']['version']
          parts = v.split(".")
          print(f"v{parts[0]}.{parts[1]}")
          PY
          )
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore(release): v${version}"
          git tag "v${version}"
          git tag -f "${minor_tag}"
          git push --follow-tags
          git push -f origin "${minor_tag}"

      - name: Build
        if: steps.bump.outputs.level != '' && steps.changes.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        if: steps.bump.outputs.level != '' && steps.changes.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.UV_PUBLISH_TOKEN }}

      - name: Trigger Read the Docs
        if: steps.bump.outputs.level != '' && steps.changes.outputs.changed == 'true'
        env:
          RTD_WEBHOOK_URL: ${{ secrets.RTD_WEBHOOK_URL }}
        run: |
          if [ -z "${RTD_WEBHOOK_URL}" ]; then
            exit 0
          fi
          curl -sS -X POST "${RTD_WEBHOOK_URL}"
